<!doctype html>
<html><head><meta charset="utf-8"><title>wispy art</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=block" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#cfdcec;overflow:hidden}
#root{position:fixed;inset:0}
/* a believable desktop: two frosted windows, so the bar is seen over real-looking content */
.win{position:fixed;border-radius:14px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(28px) saturate(1.1);box-shadow:0 30px 80px rgba(60,84,120,.28);overflow:hidden;font-family:Geist,system-ui,sans-serif;color:#1d2838}
.win .bar{height:38px;display:flex;align-items:center;padding:0 16px;font-size:12.5px;opacity:.78;border-bottom:1px solid rgba(29,40,56,.09)}
.win .bar b{font-weight:500;flex:1}
.win .bar i{width:11px;height:11px;border-radius:2px;border:1.5px solid rgba(29,40,56,.4);margin-left:16px;display:block}
.win .body{padding:22px 26px}
.ln{height:9px;border-radius:5px;background:rgba(29,40,56,.12);margin-bottom:13px}
.ln.h{height:14px;width:36%;background:rgba(29,40,56,.26);margin-bottom:20px}
.ln.a{background:rgba(70,120,190,.4)}
.ln.g{background:rgba(70,160,130,.34)}
#decor{display:none}
body.has-decor #decor{display:block}
/* the real UI: the renderer, loaded in a frame the size of wispy's window */
#ui{position:fixed;left:50%;bottom:var(--b,0px);width:920px;height:700px;border:0;background:transparent;transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 100%}
#cursor{position:fixed;left:0;top:0;width:26px;height:26px;pointer-events:none;display:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
body.has-cursor #cursor{display:block}
.banner{position:fixed;left:0;right:0;top:0;display:none;flex-direction:column;align-items:center;color:#1d2838;font-family:Geist,system-ui,sans-serif;text-align:center}
body.has-banner .banner{display:flex}
.mark{font-size:158px;font-weight:600;letter-spacing:-0.06em;line-height:1;text-shadow:0 6px 40px rgba(255,255,255,.7)}
.tag{margin-top:14px;font-size:33px;font-weight:400;letter-spacing:-0.02em;opacity:.93}
.pillmark{width:150px;height:9px;border-radius:5px;background:#1d2838;margin-top:30px;box-shadow:0 0 36px rgba(255,255,255,.8)}
body.night .win{background:rgba(14,20,44,.5);border-color:rgba(255,255,255,.14);color:#fff;box-shadow:0 30px 80px rgba(3,6,30,.5)}
body.night .win .bar{border-bottom-color:rgba(255,255,255,.08)}
body.night .win .bar i{border-color:rgba(255,255,255,.5)}
body.night .ln{background:rgba(255,255,255,.14)}
body.night .ln.h{background:rgba(255,255,255,.3)}
body.night .ln.a{background:rgba(76,194,255,.42)}
body.night .ln.g{background:rgba(120,255,190,.32)}
</style></head>
<body>
<div id="root"></div>
<div id="decor">
  <div class="win" style="left:7%;top:8%;width:54%;height:60%">
    <div class="bar"><b>Launch plan</b><i></i><i></i><i></i></div>
    <div class="body"><div class="ln h"></div><div class="ln" style="width:92%"></div><div class="ln" style="width:84%"></div><div class="ln a" style="width:62%"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:70%"></div><div class="ln g" style="width:48%"></div><div class="ln" style="width:86%"></div><div class="ln" style="width:58%"></div></div>
  </div>
  <div class="win" style="left:47%;top:20%;width:43%;height:46%;background:rgba(255,255,255,.5)">
    <div class="bar"><b>Terminal</b><i></i><i></i><i></i></div>
    <div class="body"><div class="ln a" style="width:30%"></div><div class="ln" style="width:72%"></div><div class="ln g" style="width:44%"></div><div class="ln" style="width:60%"></div><div class="ln" style="width:38%"></div><div class="ln a" style="width:52%"></div></div>
  </div>
</div>
<div class="banner"><div class="mark">wispy</div><div class="tag">Your taskbar, as a home bar.</div><div class="pillmark"></div></div>
<iframe id="ui"></iframe>
<svg id="cursor" viewBox="0 0 24 24"><path d="M4 2.5v17.2l4.6-4.3 3 6.6 3.3-1.5-3-6.5 6.4-.2z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
<script>
const q = new URLSearchParams(location.search);
if (q.get('night') === '1') document.body.classList.add('night');
for (const k of ['decor', 'cursor', 'banner']) if (q.get(k) === '1') document.body.classList.add('has-' + k);
document.documentElement.style.setProperty('--s', q.get('s') || '1');
document.documentElement.style.setProperty('--b', (q.get('b') || '0') + 'px');
document.getElementById('ui').style.colorScheme = q.get('scheme') === 'light' ? 'light' : 'dark';
if (q.get('ui') !== '0') document.getElementById('ui').src = '/ui/index.html?art=1';
else document.getElementById('ui').style.display = 'none';
// helpers the art script calls: move the pretend cursor and the UI's own cursor together
window.art = {
  get ui() { return document.getElementById('ui').contentWindow; },
  cursor(ix, iy) {
    const f = document.getElementById('ui').getBoundingClientRect(), s = f.width / 920;
    const c = document.getElementById('cursor');
    c.style.transform = `translate(${f.left + ix * s}px, ${f.top + iy * s}px)`;
    document.getElementById('ui').contentWindow.tbMock.cursor(ix, iy);
  },
  // move the UI forward by exactly `ms`: springs through the app's own stepper, CSS transitions and keyframes by hand
  step(ms) {
    const w = this.ui, d = w.document;
    w.__wispy.advance(ms);
    void d.body.offsetHeight;                                  // flush style so new transitions exist
    for (const a of d.getAnimations()) {
      if (a.__held) a.currentTime = (a.currentTime || 0) + ms;
      else { a.pause(); a.__held = true; a.currentTime = ms; }
      const end = a.effect && a.effect.getComputedTiming().endTime;
      if (end != null && end !== Infinity && a.currentTime >= end) a.finish();
    }
  },
  hideCursor() { document.getElementById('cursor').style.display = 'none'; },
  showCursor() { document.getElementById('cursor').style.display = 'block'; },
  itemCentre(n) {
    const els = [...document.getElementById('ui').contentWindow.document.querySelectorAll('#items .item')];
    const r = els[n].getBoundingClientRect();
    return [r.x + r.width / 2, r.y + r.height / 2];
  },
};
</script>
<script src="scene.js"></script>
</body></html>
